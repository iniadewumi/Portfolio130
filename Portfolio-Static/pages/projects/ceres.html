<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Ubuntu">
    
    <style>
      body {
        background-image: radial-gradient(black 1px, transparent 2px), radial-gradient(grey 1px, transparent 1px);
        background-color: #008a8a;
        background-position: center;
        background-size: 8px 8px;
      }

      a{
          text-decoration: underline;
      }
      label, a {
        color: white;
      }

      .btn-primary {
        float: right;
        background-color: #024545;
        border-color: #55A0CA;
      }

      .container {
        margin-top: 3rem;
      }

      .card {
        margin-top: 50px;
        background-color: black;
      }

      @media only screen and (min-width: 1000px) {
        .card {
          margin-left: 10rem;
          margin-right: 10rem;
        }
      }

      .card-body {
        background-color:#02a1a1;
        padding-left: 4rem;
        padding-right: 4rem;
        padding-top: 2rem;
        padding-bottom: 2rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .wayscript {
        font-family: "Segoe UI", sans-serif;
        color: #ffffff;
      }

      #ws_form_title {
        background-color: #024545;
      }

      #ws_form_description {
        font-size: 15px;
        margin-bottom: 2rem;
      }

      #ws_logo_text {
        width: 10rem;
        margin-left: -5px;
      }

    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
      $(document).ready(function() {
        // Fetch reports from serverless function
        $.ajax({
          type: 'GET',
          url: '/.netlify/functions/ceres-reports',
          success: function(data) {
            var reports = typeof data === 'string' ? JSON.parse(data) : data;
            if (reports && reports.length > 0) {
              var listHtml = '<ul>';
              reports.forEach(function(report) {
                listHtml += '<li><a href="/pages/projects/ceres-report.html?id=' + report.id + '">Report for ' + report.modified_at + '</a></li>';
              });
              listHtml += '</ul>';
              $('#reports_container').html(listHtml);
            } else {
              $('#reports_container').html('<p>There are no reports in the library.</p>');
            }
          },
          error: function() {
            // Fallback: try loading from static JSON
            $.getJSON('../../data/ceres_reports.json', function(data) {
              if (data && data.length > 0) {
                var listHtml = '<ul>';
                data.forEach(function(report) {
                  var fields = report.fields || report;
                  listHtml += '<li><a href="/pages/projects/ceres-report.html?id=' + (report.pk || report.id) + '">Report for ' + (fields.modified_at || fields.created_at) + '</a></li>';
                });
                listHtml += '</ul>';
                $('#reports_container').html(listHtml);
              } else {
                $('#reports_container').html('<p>There are no reports in the library.</p>');
              }
            }).fail(function() {
              $('#reports_container').html('<p>There are no reports in the library.</p>');
            });
          }
        });
      });
    </script>
    <title>Ceres Reports</title>
  </head>

  <body data-new-gr-c-s-check-loaded="14.1010.0" data-gr-ext-installed="">
    <div class="container" id="ws_container">
      <div class="row"> <a href="/"> <img id="ws_logo_text" src="../../images/Capture.PNG" style="zoom:50%;background: #FFB6C1; border-radius: 25px; margin-left:90px;"> </a> </div>
      <div class="card justify-content-center" id="ws_card">
        <div class="card-header wayscript" id="ws_form_title" style="font-weight:bold">CERES REPORTS OVER TIME</div>
        <div class="card-body">
          <div class="wayscript" id="ws_form_description">
            <h5 style="font-weight:bold">Report List</h5>
          </div>
          <div class="wayscript" id="reports_container">
            <p>Loading reports...</p>
          </div>
        </div>
      </div>
    </div>
  </body>

</html>
